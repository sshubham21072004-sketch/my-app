<div class="container">
  <h1 style="color: green;">color picker app</h1> 

  <input type="color" [value]="selectedcolor()" (input)="oncolorchange($event.target.value)" />

  <div class="preview-box" [style.background-color]="selectedcolor()">preview</div>

  <p class="hex-code">HEX Code: <b>{{ selectedcolor() }}</b>
  </p>

  <button (click)="copycolor()">copy color</button>
</div>
